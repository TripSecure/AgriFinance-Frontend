<div class="dashboard">
  <div class="main d-flex">
    <aside>
      <nav>
        <div class="sidebar-brand" aria-label="TripSecure AgriFinance">
          <strong>TripSecure</strong>
          <span>AgriFinance</span>
        </div>

        <a
          [routerLink]="['home']"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <span class="material-symbols-outlined">grid_view</span>
          Dashboard
        </a>
        <a [routerLink]="['farmers']" routerLinkActive="active-link">
          <span class="material-symbols-outlined">people</span>
          My Farmers
        </a>
        <a [routerLink]="['farms']" routerLinkActive="active-link">
          <span class="material-symbols-outlined">yard</span>
          Farms
        </a>
        <a [routerLink]="['visits']" routerLinkActive="active-link">
          <span class="material-symbols-outlined">calendar_month</span>
          Visit Schedule
        </a>
      </nav>
    </aside>
    <div class="w-100">
      <nav>
        <app-navbar />
      </nav>
      <div class="content">
        <router-outlet />
      </div>
    </div>
  </div>
</div>
