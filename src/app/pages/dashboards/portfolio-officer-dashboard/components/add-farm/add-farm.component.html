<div class="add-farmer-page">
  <header class="page-header">
    <a [routerLink]="backLink()" class="back-link">
      <mat-icon aria-hidden="true">arrow_back</mat-icon>
      <span>{{ backLinkLabel() }}</span>
    </a>
    <!-- <div>
      <p>Portfolio Officer</p>
      <h1>{{ pageTitle() }}</h1>
    </div> -->
  </header>

  <section class="form-section" aria-labelledby="farmer-details-heading">
    <header class="form-section-header">
      <h2 id="farmer-details-heading">Farm Details</h2>
    </header>

    <div class="form-section-body form-grid">
      @if (!isFarmerContext()) {
        <app-form-input
          name="farmerId"
          label="Associated Farmer"
          [isSelect]="true"
          [options]="farmerOptions"
          [isRequired]="true"
          [formGroup]="farmerDetailsForm"
        />
      }
      <app-form-input
        name="farmerCode"
        label="Farmer ID / Code"
        type="text"
        placeholder="FRM-0001"
        [isRequired]="true"
        [formGroup]="farmerDetailsForm"
      />
      <app-form-input
        name="region"
        label="Region"
        [isOption]="true"
        [selections]="regionOptions"
        [isRequired]="true"
        [formGroup]="farmerDetailsForm"
      />
      <app-form-input
        name="district"
        label="District"
        type="text"
        placeholder="Ejura Sekyedumase"
        [isRequired]="true"
        [formGroup]="farmerDetailsForm"
      />
      <app-form-input
        name="community"
        label="Community"
        type="text"
        placeholder="Aframso"
        [isRequired]="true"
        [formGroup]="farmerDetailsForm"
      />
      <app-form-input
        name="farmAddress"
        label="Farm Address"
        type="text"
        placeholder="Kitson Street"
        [isRequired]="true"
        [formGroup]="farmerDetailsForm"
      />
      <app-form-input
        name="gpsLatitude"
        label="GPS Latitude"
        type="number"
        placeholder="5.6037"
        [isRequired]="true"
        [formGroup]="farmerDetailsForm"
      />
      <app-form-input
        name="gpsLongitude"
        label="GPS Longitude"
        type="number"
        placeholder="-0.1870"
        [isRequired]="true"
        [formGroup]="farmerDetailsForm"
      />
      <app-form-input
        name="cooperativeGroupName"
        label="Cooperative / Group Name"
        type="text"
        placeholder="Green Growers Cooperative"
        [isRequired]="true"
        [formGroup]="farmerDetailsForm"
      />
    </div>
  </section>

  <section class="form-section mt-4" aria-labelledby="production-heading">
    <header class="form-section-header">
      <h2 id="production-heading">Productivity</h2>
    </header>

    <div class="form-section-body form-grid">
      <app-form-input
        name="farmSizeAcres"
        label="Farm Size (Acres)"
        type="number"
        placeholder="4.5"
        [isRequired]="true"
        [formGroup]="productionDetailsForm"
      />
      <app-form-input
        name="primaryCrop"
        label="Primary Crop"
        [isOption]="true"
        [selections]="cropOptions"
        [isRequired]="true"
        [formGroup]="productionDetailsForm"
      />
      <app-form-input
        name="secondaryCrop"
        label="Secondary Crop"
        [isOption]="true"
        [selections]="cropOptions"
        [formGroup]="productionDetailsForm"
      />
      <app-form-input
        name="expectedAnnualYield"
        label="Expected Annual Yield (Kg)"
        type="number"
        placeholder="1200"
        [formGroup]="productionDetailsForm"
      />
      <app-form-input
        name="farmingExperienceYears"
        label="Farming Experience (Years)"
        type="number"
        placeholder="6"
        [formGroup]="productionDetailsForm"
      />
      <app-form-input
        name="irrigationMethod"
        label="Irrigation Method"
        [isOption]="true"
        [selections]="irrigationOptions"
        [formGroup]="productionDetailsForm"
      />
    </div>
  </section>

  <div class="step-actions">
    <a
      [routerLink]="backLink()"
      class="secondary-action text-decoration-none d-inline-flex align-items-center"
    >
      Cancel
    </a>
    <button type="button" class="primary-action" [disabled]="isCreating()" (click)="onSubmit()">
      {{ submitButtonText() }}
    </button>
  </div>

  @if (localSubmitError()) {
    <p class="form-feedback form-feedback-error">{{ localSubmitError() }}</p>
  }
</div>
